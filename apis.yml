name: Hinge
type: Index
kind: company
description: >-
  Hinge is a relationship-oriented dating app owned by Match Group, marketed
  as "designed to be deleted" with a product focus on prompt-driven profiles
  and compatibility matching intended to drive actual dates rather than
  prolonged in-app engagement. Hinge Labs is the company's in-house research
  arm publishing data on dating behavior and outcomes. Hinge is a consumer
  mobile product; no public developer or partner API has been identified.
  This entry catalogs the company surface for the API Evangelist index.
